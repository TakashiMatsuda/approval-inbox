name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node:sqlite is unflagged from Node 24; 22.5–23.3 need --experimental-sqlite.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm test
